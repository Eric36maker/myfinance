<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3348D4">
  <title>MY Finance</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MY Finance">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root{
  --ink:#172033; --ink-2:#4A5568; --ink-3:#7A8599; --line:#E3E7EF; --line-2:#EEF1F6;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F8F9FC;
  --brand:#3348D4; --brand-ink:#FFFFFF; --brand-soft:#E8EBFC; --brand-deep:#2536A8;
  --in:#13895C; --in-soft:#E3F4EC; --out:#D2453B; --out-soft:#FBE9E7; --goal:#E39A1C; --goal-soft:#FCF1DD;
  --warn:#B7791F; --warn-soft:#FDF3DF;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(23,32,51,.06),0 8px 24px rgba(23,32,51,.06);
  --shadow-lift:0 12px 40px rgba(23,32,51,.18);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav-w:248px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E9EDF5; --ink-2:#B4BCCB; --ink-3:#8590A3; --line:#273149; --line-2:#1F2840;
    --bg:#0E1424; --surface:#161E31; --surface-2:#1B2439;
    --brand:#6F82FF; --brand-ink:#0E1424; --brand-soft:#232E55; --brand-deep:#A9B5FF;
    --in:#3BC28A; --in-soft:#15352B; --out:#FF7468; --out-soft:#3A1E20; --goal:#F5B54A; --goal-soft:#3A2D15;
    --warn:#F0B44C; --warn-soft:#3A2E14;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#E9EDF5; --ink-2:#B4BCCB; --ink-3:#8590A3; --line:#273149; --line-2:#1F2840;
  --bg:#0E1424; --surface:#161E31; --surface-2:#1B2439;
  --brand:#6F82FF; --brand-ink:#0E1424; --brand-soft:#232E55; --brand-deep:#A9B5FF;
  --in:#3BC28A; --in-soft:#15352B; --out:#FF7468; --out-soft:#3A1E20; --goal:#F5B54A; --goal-soft:#3A2D15;
  --warn:#F0B44C; --warn-soft:#3A2E14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--ink-3)} .small{font-size:13px} .tiny{font-size:12px}
.pos{color:var(--in)} .neg{color:var(--out)}
.row{display:flex;align-items:center;gap:10px} .grow{flex:1;min-width:0} .wrap{flex-wrap:wrap}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- boot & auth ---------- */
.boot{min-height:100vh;display:grid;place-content:center;gap:22px;justify-items:center}
.boot-mark{font-weight:800;font-size:28px;letter-spacing:-.02em}
.boot-mark span{color:var(--brand);margin-left:4px;font-weight:600}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-side{background:var(--brand);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-side h1{font-size:44px;line-height:1.05;letter-spacing:-.03em;margin:0 0 18px;max-width:12ch}
.auth-side p{opacity:.88;max-width:40ch;font-size:16px;margin:0}
.auth-tape{display:grid;gap:10px;margin-top:40px;max-width:360px}
.auth-tape div{display:flex;justify-content:space-between;background:rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;font-weight:600}
.auth-tape div span:last-child{font-variant-numeric:tabular-nums}
.auth-main{display:grid;place-items:center;padding:32px 20px;background:var(--surface)}
.auth-card{width:100%;max-width:380px}
.auth-card h2{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
.auth-card .lang-row{display:flex;gap:6px;justify-content:flex-end;margin-bottom:28px}
.auth-links{display:flex;justify-content:space-between;margin-top:14px;font-size:14px}
.linkbtn{background:none;border:0;color:var(--brand);padding:0;font-weight:600}

/* ---------- forms ---------- */
.field{display:grid;gap:6px;margin-bottom:14px}
.field>span,.label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 12px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--brand)}
textarea.input{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--brand);color:var(--brand-ink);transition:transform .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-deep)}
.btn.danger{background:var(--out-soft);color:var(--out)}
.btn.block{width:100%}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;border:0;background:transparent;color:var(--ink-2)}
.iconbtn:hover{background:var(--line-2);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
.seg{display:flex;background:var(--line-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 10px;border-radius:9px;font-weight:700;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on.t-expense{color:var(--out)} .seg button.on.t-income{color:var(--in)} .seg button.on.t-transfer{color:var(--brand)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch input{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex:none}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--brand)} .switch input:checked::after{transform:translateX(18px)}
.err{background:var(--out-soft);color:var(--out);padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px}
.note{background:var(--brand-soft);color:var(--brand-deep);padding:10px 12px;border-radius:10px;font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100vh}
.nav{position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:4px;background:var(--surface);border-right:1px solid var(--line)}
.nav .brand{font-weight:800;font-size:21px;letter-spacing:-.02em;padding:4px 12px 20px}
.nav .brand span{color:var(--brand);font-weight:600;margin-left:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--line-2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand-deep)}
.nav .cta{margin:14px 4px 18px}
.nav .foot{margin-top:auto;padding:12px;font-size:12px;color:var(--ink-3)}
.main{min-width:0;padding:22px 28px 60px;max-width:1240px;width:100%}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:24px;margin:0;letter-spacing:-.02em}
.monthpick{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.monthpick strong{min-width:132px;text-align:center;font-size:14px}
.tabbar{display:none}
.fab{position:fixed;right:28px;bottom:28px;z-index:30;width:62px;height:62px;border-radius:20px;border:0;background:var(--brand);color:#fff;box-shadow:var(--shadow-lift);display:none;place-items:center}
.fab svg.i{width:28px;height:28px}

/* ---------- cards & lists ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.card>h3,.sect-title{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card>h3>button,.card>h3>span.small{margin-left:auto}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.card,.kpi,.hero{min-width:0}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-2);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
button.li:hover{background:var(--surface-2)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.amt{font-weight:700;white-space:nowrap;text-align:right}
.amt small{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--line-2);color:var(--ink-2)}
.badge.pending{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--in-soft);color:var(--in)}
.badge.late{background:var(--out-soft);color:var(--out)}
.badge.ai{background:var(--brand-soft);color:var(--brand-deep)}
.day-head{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink-3);padding:14px 4px 4px;text-transform:capitalize}
.empty{text-align:center;padding:36px 16px;color:var(--ink-3)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.bar{height:8px;border-radius:999px;background:var(--line-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--brand)}
.bar.in>i{background:var(--in)} .bar.over>i{background:var(--out)} .bar.warn>i{background:var(--goal)}

/* ---------- hero (dashboard) ---------- */
.hero{background:var(--ink);color:#fff;border-radius:24px;padding:24px;position:relative;overflow:hidden}
:root[data-theme="dark"] .hero{background:#1E2A4A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:#1E2A4A}}
.hero .lbl{opacity:.72;font-size:13.5px;font-weight:600}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0 2px}
.hero .proj{opacity:.75;font-size:13.5px}
.flow{margin-top:22px;display:grid;gap:10px}
.flow-bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.12)}
.flow-bar i{display:block;height:100%}
.flow-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px}
.flow-legend b{display:block;font-size:17px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:14px}
.alert.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.alert.bad{background:var(--out-soft);border-color:transparent;color:var(--out)}
.alert .btn{margin-left:auto}

/* ---------- charts ---------- */
.donut-wrap{display:grid;grid-template-columns:160px minmax(0,1fr);gap:18px;align-items:center}
.legend{display:grid;gap:7px;font-size:13.5px;grid-template-columns:minmax(0,1fr)}
.legend .row span:last-child{margin-left:auto;font-weight:700;text-align:right;flex:none}
.legend .row .ellipsis{flex:1;min-width:0}
.chart-bars svg{width:100%;height:auto;display:block}
.chart-bars text{fill:var(--ink-3);font-size:11px;font-family:var(--font)}

/* ---------- credit card visual ---------- */
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cc{border-radius:18px;padding:16px;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;border:0;text-align:left;position:relative;overflow:hidden}
.cc::after{content:'';position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.cc.on{outline:3px solid var(--brand);outline-offset:3px}
.cc .nm{font-weight:800;font-size:16px}
.cc .lim{font-size:12.5px;opacity:.85}
.cc .bar{background:rgba(255,255,255,.25)} .cc .bar>i{background:#fff}
.inv-head{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.kpi .lbl{font-size:12.5px;color:var(--ink-3);font-weight:600}
.kpi .val{font-size:19px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.recon{display:grid;gap:12px}
.chk{width:22px;height:22px;accent-color:var(--in);flex:none}
.diff-ok{color:var(--in)} .diff-bad{color:var(--out)}

/* ---------- goals ---------- */
.goal{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center}
.ring{width:76px;height:76px}
.ring text{font-weight:800;font-size:15px;fill:var(--ink);font-family:var(--font)}

/* ---------- sheet (modal) ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,20,36,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
.sheet{background:var(--surface);border-radius:22px;width:100%;max-width:560px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:var(--shadow-lift);animation:pop .18s ease-out}
.sheet.wide{max-width:820px}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.sheet-head h2{font-size:18px;margin:0;flex:1;letter-spacing:-.01em}
.sheet-body{padding:6px 18px 18px;overflow:auto}
.sheet-foot{padding:12px 18px 18px;display:flex;gap:10px;border-top:1px solid var(--line-2)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
.amount-input{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding:4px 0 8px;margin:6px 0 16px}
.amount-input select{border:0;background:transparent;font-weight:700;font-size:15px;color:var(--ink-2);padding:0}
.amount-input input{border:0;outline:0;background:transparent;font-size:36px;font-weight:800;letter-spacing:-.02em;width:100%;min-width:0}
.amount-input.t-expense input{color:var(--out)} .amount-input.t-income input{color:var(--in)} .amount-input.t-transfer input{color:var(--brand)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;max-height:212px;overflow:auto;padding:2px}
.cat{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:600;text-align:center;line-height:1.2}
.cat .e{font-size:20px}
.cat.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
.payto{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.payto .chip{flex:none}
.rate-box{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.more-toggle{background:none;border:0;color:var(--brand);font-weight:700;padding:4px 0 12px}

/* ---------- capture ---------- */
.cap-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.cap-opt{border:1.5px solid var(--line);background:var(--surface-2);border-radius:16px;padding:18px 10px;display:grid;justify-items:center;gap:8px;font-weight:700;font-size:14px}
.cap-opt svg.i{width:28px;height:28px;color:var(--brand)}
.cap-opt:hover{border-color:var(--brand)}
.rec{display:grid;justify-items:center;gap:14px;padding:18px 0}
.rec-btn{width:92px;height:92px;border-radius:50%;border:0;background:var(--out);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 0 rgba(210,69,59,.5)}
.rec-btn.live{animation:pulse 1.4s infinite}
.rec-btn svg.i{width:38px;height:38px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(210,69,59,.45)}70%{box-shadow:0 0 0 22px rgba(210,69,59,0)}100%{box-shadow:0 0 0 0 rgba(210,69,59,0)}}
.rec-time{font-size:26px;font-weight:800}
.preview-img{max-width:100%;max-height:240px;border-radius:12px;display:block;margin:0 auto 12px;border:1px solid var(--line)}
.sugg{border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:grid;gap:8px}
.conflict{background:var(--goal-soft);border-radius:14px;padding:14px;margin-bottom:12px;color:var(--ink)}
.conflict h4{margin:0 0 6px;font-size:15px}
.conflict .row{margin-top:10px}
.thinking{display:grid;justify-items:center;gap:12px;padding:30px 0;color:var(--ink-2)}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12.5px;color:var(--ink-3);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line-2)}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl-wrap{overflow-x:auto}

/* ---------- calendário ---------- */
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-wd{font-size:12px;font-weight:700;color:var(--ink-3);text-align:center;padding:4px 0}
.cal-cell{min-height:78px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-2);padding:6px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.cal-cell.empty{background:transparent;border-color:transparent}
.cal-cell.today{border-color:var(--brand)}
.cal-cell.sel{background:var(--brand-soft);border-color:var(--brand)}
.cal-n{font-weight:800;font-size:13px}
.cal-v{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-dots{margin-top:auto;display:flex;gap:3px}
.cd{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:middle}
.cd-in{background:var(--in)} .cd-out{background:var(--out)} .cd-invoice{background:var(--brand)} .cd-sub{background:#7B4FD1} .cd-loan{background:var(--goal)} .cd-goal{background:var(--goal)}
.cal-layout{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:860px){ .cal-cell{min-height:52px;padding:4px;border-radius:9px} .cal-v{font-size:10px} .cal-grid{gap:3px} .cal-layout{grid-template-columns:minmax(0,1fr)} }

/* ---------- toast ---------- */
#toast-root{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow-lift);animation:pop .2s}
.toast.bad{background:var(--out);color:#fff}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .dash{grid-template-columns:1fr}
  .cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .auth{grid-template-columns:1fr}
  .auth-side{padding:28px 22px}
  .auth-side h1{font-size:30px}
  .auth-tape{display:none}
  .shell{grid-template-columns:1fr}
  .nav{display:none}
  .main{padding:16px 16px 110px}
  .topbar h1{font-size:21px}
  .cols-2,.cols-3{grid-template-columns:minmax(0,1fr)}
  .topbar h1{flex:1 1 auto;min-width:0}
  .topbar>.grow{display:none}
  .topbar .monthpick{order:5;width:100%;justify-content:space-between;margin-left:0}
  .inv-head{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a,.tabbar button{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-3);text-decoration:none;background:none;border:0;padding:4px 0}
  .tabbar a.on{color:var(--brand)}
  .tabbar .cap{width:54px;height:54px;border-radius:18px;background:var(--brand);color:#fff;place-items:center;margin:-22px auto 0;box-shadow:var(--shadow-lift);display:grid}
  .tabbar .cap svg.i{width:26px;height:26px}
  .scrim{align-items:flex-end;padding:0}
  .sheet,.sheet.wide{border-radius:22px 22px 0 0;max-height:94vh;max-width:none}
  .hero .big{font-size:32px}
  .donut-wrap{grid-template-columns:110px minmax(0,1fr);gap:12px}
  .grid2.keep{grid-template-columns:1fr 1fr}
  #toast-root{bottom:96px}
}
@media (min-width:861px){ .fab{display:grid} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const pad = n => (n < 10 ? '0' : '') + n;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};

function todayStr() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function ymOf(d) { return String(d).slice(0, 7); }
function addMonths(ym, n) {
  let y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + n;

}
function lastDay(ym) { return new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate(); }

function addDays(ds, n) { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000); }

/* ---------- i18n ---------- */

/* ---------- API ---------- */
function call(action, payload) {
  return new Promise((resolve, reject) => {
    const done = r => {
      if (!r) return reject(new Error('NETWORK'));
      if (r.ok) return resolve(r.data);
      if (r.error === 'SESSION_EXPIRED') { logoutLocal(); toast(t('err.SESSION_EXPIRED'), true); }
      reject(new Error(r.error || 'ERROR'));
    };
    if (window.API_URL) {
      // versão hospedada fora do Google: chamada sem cookies (credentials: 'omit')
      fetch(window.API_URL, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: S.token, action, payload: payload || {} }) })
        .then(r => r.json()).then(done).catch(() => reject(new Error('NETWORK')));
    } else if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(done).withFailureHandler(e => reject(new Error((e && e.message) || 'NETWORK'))).api(S.token, action, payload || {});
    } else {
      fetch('rpc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: S.token, action, payload: payload || {} }) })
        .then(r => r.json()).then(done).catch(() => reject(new Error('NETWORK')));
    }
  });
}
function errMsg(e) { const k = 'err.' + (e && e.message || 'ERROR'); const m = t(k); return m === k ? t('err.ERROR') + ' (' + esc(e && e.message) + ')' : m; }

/* ---------- toasts ---------- */
function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  const root = $('#toast-root');
  while (root.children.length >= 2) root.firstChild.remove();
  root.appendChild(el);
  setTimeout(() => el.remove(), bad ? 5000 : 2800);
}

/** cotação: quanto vale 1 unidade de `cur` na moeda base */
function rateOf(cur) {
  if (!cur || cur === base()) return 1;
  const r = D().Rates.find(x => x.currency === cur);
  return r ? Number(r.rate) : null;
}
function toBase(v, cur) { const r = rateOf(cur); return r == null ? null : v * r; }
function missingRates() {
  const set = new Set();
  D().Accounts.forEach(a => !a.archived && set.add(a.currency));
  D().Cards.forEach(a => !a.archived && set.add(a.currency));
  D().Assets.forEach(a => set.add(a.currency));
  return [...set].filter(c => rateOf(c) == null);
}

function accountBalance(a, opts) {
  opts = opts || {};
  let b = a.initialBalance;
  for (const x of D().Transactions) {
    if (opts.until && x.date > opts.until) continue;
    if (!opts.projected && x.status === 'pending') continue;
    if (x.accountId === a.id) {
      if (x.type === 'income') b += x.accAmount;
      else if (x.type === 'borrow') b += x.accAmount;
      else if (x.type === 'expense' || x.type === 'payment' || x.type === 'transfer' || x.type === 'lend') b -= x.accAmount;
    }
    if (x.type === 'transfer' && x.toAccountId === a.id) b += x.toAmount;
  }
  return round2(b);
}
function totalBalance(opts) {
  let tot = 0;
  for (const a of activeAccounts()) {
    if (!a.includeInTotal) continue;
    const v = toBase(accountBalance(a, opts), a.currency);
    if (v != null) tot += v;
  }
  return round2(tot);
}

/* ---- cartões e faturas ---- */
function invoiceDates(c, month) {
  const closeYm = c.dueDay > c.closingDay ? month : addMonths(month, -1);
  return { closing: dayIn(closeYm, c.closingDay), due: dayIn(month, c.dueDay) };
}
function invoiceFor(c, date) {
  const d = +date.slice(8, 10), ym = date.slice(0, 7);
  const closeMonth = d >= c.closingDay ? addMonths(ym, 1) : ym;
  return c.dueDay > c.closingDay ? closeMonth : addMonths(closeMonth, 1);
}
function invoiceTx(c, month) { return D().Transactions.filter(x => x.cardId === c.id && x.invoice === month && x.type !== 'payment'); }
function invoiceInfo(c, month) {
  const txs = invoiceTx(c, month);
  const total = round2(sum(txs, x => x.type === 'income' ? -x.accAmount : x.accAmount));
  const paid = round2(sum(D().Transactions.filter(x => x.cardId === c.id && x.invoice === month && x.type === 'payment'), x => x.amount));
  const rec = D().Invoices.find(i => i.cardId === c.id && i.month === month) || null;
  const dt = invoiceDates(c, month);
  const td = todayStr();
  let status = 'open';
  if (td >= dt.closing) status = 'closed';
  if (total > 0 && paid >= total - 0.009) status = 'paid';
  else if (status === 'closed' && td > dt.due) status = 'late';
  if (total <= 0 && td >= dt.closing) status = paid > 0 || total < 0 ? 'paid' : 'closed';
  return { month, txs, total, paid, remaining: round2(Math.max(0, total - paid)), status, rec, closing: dt.closing, due: dt.due, reconciled: rec && rec.status === 'reconciled' };
}
function currentInvoiceMonth(c) { return invoiceFor(c, todayStr()); }
function cardUsed(c) {
  const months = new Set(D().Transactions.filter(x => x.cardId === c.id).map(x => x.invoice));
  let used = 0;
  months.forEach(m => { const i = invoiceInfo(c, m); used += Math.max(0, i.total - i.paid); });
  return round2(used);
}
function cardDebtBase() {
  let tot = 0;
  activeCards().forEach(c => { const v = toBase(cardUsed(c), c.currency); if (v != null) tot += v; });
  return round2(tot);
}

/** itens da fatura agrupando as partes de compras divididas em uma só unidade */
function invoiceUnits(txs) {
  const map = {}, out = [];
  txs.forEach(x => {
    const v = x.type === 'income' ? -x.accAmount : x.accAmount;
    if (x.splitId) {
      if (!map[x.splitId]) { map[x.splitId] = { ids: [], amount: 0, date: x.date, txs: [] }; out.push(map[x.splitId]); }
      const u = map[x.splitId]; u.ids.push(x.id); u.amount = round2(u.amount + v); u.txs.push(x);
    } else out.push({ ids: [x.id], amount: v, date: x.date, txs: [x] });
  });
  out.forEach(u => u.reconciled = u.txs.every(x => x.reconciled));
  return out;
}
function matchStatement(lines, txs) {
  const units = invoiceUnits(txs), used = new Set();
  const matched = lines.map(l => {
    const m = units.find(u => !used.has(u) && Math.abs(u.amount - l.amount) < 0.011 && (!l.date || Math.abs(daysBetween(u.date, l.date)) <= 5));
    if (m) used.add(m);
    return { l, m };
  });
  return { matched, extra: units.filter(u => !used.has(u)) };
}

/* ---- mês ---- */
/** lançamentos que contam como receita/despesa (sem transferências e pagamentos de fatura) */
function flowTx(month, opts) {
  opts = opts || {};
  return D().Transactions.filter(x => (x.type === 'income' || x.type === 'expense') && ymOf(x.date) === month && (opts.includePending || x.status !== 'pending' || x.cardId));
}
function txBase(x) {
  const holderCur = x.cardId ? (card(x.cardId) || {}).currency : (acc(x.accountId) || {}).currency;
  const v = toBase(x.accAmount, holderCur || base());
  return v == null ? 0 : v;
}
function monthTotals(month, opts) {
  const txs = flowTx(month, opts);
  const inc = round2(sum(txs.filter(x => x.type === 'income' && !x.cardId), txBase));
  const refunds = round2(sum(txs.filter(x => x.type === 'income' && x.cardId), txBase));
  const exp = round2(sum(txs.filter(x => x.type === 'expense'), txBase) - refunds);
  return { inc, exp, res: round2(inc - exp) };
}
function spentByCategory(month) {
  const map = {};
  flowTx(month, { includePending: true }).forEach(x => {
    if (!x.categoryId) return;
    const sign = x.type === 'expense' ? 1 : (x.cardId ? -1 : 0);
    if (!sign) return;
    map[x.categoryId] = (map[x.categoryId] || 0) + sign * txBase(x);
  });
  return map;
}
function incomeByCategory(month) {
  const map = {};
  flowTx(month, { includePending: true }).filter(x => x.type === 'income' && !x.cardId).forEach(x => { map[x.categoryId || '_'] = (map[x.categoryId || '_'] || 0) + txBase(x); });
  return map;
}
function budgetFor(catId, month) {
  const b = D().Budgets.find(x => x.categoryId === catId && x.month === month) || D().Budgets.find(x => x.categoryId === catId && x.month === '*');
  return b ? b.amount : 0;
}
function pendingBills() {
  return D().Transactions.filter(x => x.status === 'pending' && !x.cardId && (x.type === 'expense' || x.type === 'income')).sort((a, b) => a.date.localeCompare(b.date));
}
function loanOutstanding(l) {
  const back = l.direction === 'receivable' ? 'borrow' : 'lend';
  return round2(Math.max(0, l.amount - sum(D().Transactions.filter(x => x.loanId === l.id && x.type === back), x => x.amount)));
}
function subMonthly(sb) { return sb.cycle === 'yearly' ? sb.amount / 12 : sb.cycle === 'weekly' ? sb.amount * 52 / 12 : sb.amount; }
function goalSaved(g) { return round2(sum(D().GoalEntries.filter(e => e.goalId === g.id), e => e.amount)); }

function netWorth() {
  const cash = totalBalance();
  let assets = 0, liab = 0;
  D().Assets.forEach(a => { if (a.status === 'sold') return; const v = toBase(a.value, a.currency) || 0; if (a.class === 'liability') liab += v; else assets += v; });
  const cards = cardDebtBase();
  D().Loans.forEach(l => { const v = toBase(loanOutstanding(l), l.currency) || 0; if (l.direction === 'receivable') assets += v; else liab += v; });
  return { cash, assets: round2(assets), liab: round2(liab), cards, total: round2(cash + assets - liab - cards) };
}

  $$('[data-lang]').forEach(b => b.onclick = () => { LANG = b.dataset.lang; store.set('mf_lang', LANG); renderAuth(mode); });
  $$('[data-auth]').forEach(b => b.onclick = () => renderAuth(b.dataset.auth));

    ev.preventDefault();

    const btn = $('button[type=submit]', f);
    btn.disabled = true;
    try {
      if (mode === 'login') { const r = await call('login', { email: fd.email, password: fd.password, device: navigator.userAgent }); afterLogin(r); }
      else if (mode === 'register') { const r = await call('register', Object.assign(fd, { lang: LANG, device: navigator.userAgent })); afterLogin(r); }
      else if (mode === 'forgot') { S.resetEmail = fd.email; await call('requestReset', { email: fd.email }); toast(t('auth.codeSent')); renderAuth('reset'); }
      else if (mode === 'reset') { const r = await call('resetPassword', Object.assign(fd, { device: navigator.userAgent })); afterLogin(r); }
    } catch (e) { renderAuth(mode, errMsg(e)); }
  };
  const first = $('input', f); if (first && !first.value) first.focus();
}

async function loadApp(silent) {

  try {
    const r = await call('bootstrap');

/** atualiza cotações automaticamente uma vez por dia */
async function autoRates() {
  const need = new Set();
  [...D().Accounts, ...D().Cards, ...D().Assets, ...D().Goals].forEach(x => x.currency && x.currency !== base() && need.add(x.currency));
  if (!need.size) return;
  const td = todayStr();
  const stale = [...need].some(c => { const r = D().Rates.find(x => x.currency === c); return !r || r.date !== td; });
  if (!stale) return;
  try {
    const rows = await call('refreshRates', {});
    rows.forEach(r => upsertLocal('Rates', r));
    rerender();
  } catch (e) { /* silencioso: o usuário pode informar manualmente */ }
}
async function snapshotIfNeeded() {
  const m = ymOf(todayStr());
  if (missingRates().length) return;
  const nw = netWorth();
  const snap = D().Snapshots.find(s => s.month === m);
  if (snap && Math.abs(snap.netWorth - nw.total) < 0.01) return;
  try {
    const r = await call('saveSnapshot', { month: m, netWorth: nw.total, assets: round2(nw.cash + nw.assets), liabilities: round2(nw.liab + nw.cards) });
    upsertLocal('Snapshots', r);
  } catch (e) { }
}

function upsertLocal(table, row) {
  const list = D()[table];
  const i = list.findIndex(x => x.id === row.id);
  if (i >= 0) list[i] = row; else list.push(row);
}
function removeLocal(table, ids) { ids = [].concat(ids); D()[table] = D()[table].filter(x => ids.indexOf(x.id) < 0); }

/* ---------- Orçamento ---------- */
VIEWS.budget = () => {
  const m = S.month;
  const spent = spentByCategory(m);
  const cats = activeCats('expense');
  const rows = cats.map(c => ({ c, b: budgetFor(c.id, m), s: spent[c.id] || 0, own: D().Budgets.find(x => x.categoryId === c.id && x.month === m) }));
  const withB = rows.filter(r => r.b > 0).sort((a, b) => b.s / b.b - a.s / a.b);
  const without = rows.filter(r => !r.b);
  const totB = sum(withB, r => r.b), totS = sum(withB, r => r.s), totAll = sum(Object.values(spent));
  const inc = monthTotals(m, { includePending: true }).inc;
  const avg3 = c => { let s = 0; for (let k = 1; k <= 3; k++) s += spentByCategory(addMonths(m, -k))[c] || 0; return round2(s / 3); };
  const line = r => {
    const p = r.b ? r.s / r.b * 100 : 0;
    return '<button class="li" data-act="editBudget" data-id="' + r.c.id + '">' + catIco(r.c) + '<span class="grow"><span class="row"><b class="grow ellipsis">' + esc(r.c.name) + '</b><span class="small ' + (p > 100 ? 'neg' : 'muted') + '">' + hv(money(r.s)) + ' / ' + hv(money(r.b)) + '</span></span>' +
      '<span class="bar ' + (p > 100 ? 'over' : p > 80 ? 'warn' : 'in') + '" style="display:block;margin-top:7px"><i style="width:' + Math.min(100, p) + '%"></i></span>' +
      '<span class="small muted" style="display:block;margin-top:4px">' + (p > 100 ? t('budget.over', { v: hv(money(r.s - r.b)) }) : t('budget.left', { v: hv(money(r.b - r.s)) })) + (r.own ? ' · ' + t('budget.onlyMonth') : '') + '</span></span></button>';
  };
  return topbar(t('nav.budget'), true) +
    '<div class="grid cols-3" style="margin-bottom:16px">' +
    '<div class="kpi"><div class="lbl">' + t('budget.planned') + '</div><div class="val">' + hv(money(totB)) + '</div></div>' +
    '<div class="kpi"><div class="lbl">' + t('budget.spentPlanned') + '</div><div class="val ' + (totS > totB ? 'neg' : '') + '">' + hv(money(totS)) + '</div></div>' +
    '<div class="kpi"><div class="lbl">' + t('budget.ofIncome') + '</div><div class="val">' + (inc ? Math.round(totB / inc * 100) + '%' : '—') + '</div></div></div>' +
    '<div class="grid cols-2" style="align-items:start">' +
    '<div class="card"><h3>' + t('budget.withBudget') + '</h3>' + (withB.length ? '<div class="list">' + withB.map(line).join('') + '</div>' : '<div class="empty"><strong>' + t('empty.budgetTitle') + '</strong>' + t('empty.budgetSub') + '<br><button class="btn" data-act="suggestBudget">' + icon('spark') + t('budget.suggest') + '</button></div>') + '</div>' +
    '<div class="card"><h3>' + t('budget.noBudget') + '<span class="small muted">' + t('budget.totalSpent', { v: hv(money(totAll)) }) + '</span></h3><div class="list">' +
    without.map(r => { const a = avg3(r.c.id); return '<button class="li" data-act="editBudget" data-id="' + r.c.id + '">' + catIco(r.c) + '<span class="grow"><b>' + esc(r.c.name) + '</b><span class="small muted" style="display:block">' + t('budget.avg3', { v: hv(money(a)) }) + '</span></span><span class="amt">' + hv(money(r.s)) + '</span></button>'; }).join('') +
    '</div></div></div>';

/* ---------- Objetivos ---------- */
VIEWS.goals = () => {
  const gs = D().Goals.filter(g => g.status !== 'archived');
  const td = todayStr();
  const cardsHtml = gs.map(g => {
    const s = goalSaved(g), p = Math.max(0, Math.min(1, s / g.target));
    const left = Math.max(0, g.target - s);
    let perMonth = '';
    if (g.deadline && left > 0) {
      const months = Math.max(1, (+g.deadline.slice(0, 4) - +td.slice(0, 4)) * 12 + (+g.deadline.slice(5, 7) - +td.slice(5, 7)));
      perMonth = t('goal.perMonth', { v: hv(money(left / months, g.currency)), n: months });
    }
    const R = 32, C = 2 * Math.PI * R;
    return '<div class="card"><div class="goal"><svg class="ring" viewBox="0 0 76 76" role="img" aria-label="' + Math.round(p * 100) + '%"><circle cx="38" cy="38" r="' + R + '" fill="none" stroke="var(--line-2)" stroke-width="8"/><circle cx="38" cy="38" r="' + R + '" fill="none" stroke="' + esc(g.color) + '" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + (C * p) + ' ' + C + '" transform="rotate(-90 38 38)"/><text x="38" y="43" text-anchor="middle">' + Math.round(p * 100) + '%</text></svg>' +
      '<div><div class="row"><b class="grow" style="font-size:16px">' + esc(g.icon) + ' ' + esc(g.name) + '</b>' + (g.status === 'done' || p >= 1 ? '<span class="badge ok">' + t('goal.done') + '</span>' : '') + '<button class="iconbtn" data-act="editGoal" data-id="' + g.id + '">' + icon('edit') + '</button></div>' +
      '<div style="font-size:20px;font-weight:800;margin-top:2px">' + hv(money(s, g.currency)) + ' <span class="small muted" style="font-weight:600">' + t('of') + ' ' + hv(money(g.target, g.currency)) + '</span></div>' +
      '<div class="small muted">' + (g.deadline ? t('goal.until', { d: dateLabel(g.deadline, { month: 'long', year: 'numeric' }) }) + (perMonth ? ' · ' + perMonth : '') : t('goal.noDeadline')) + '</div></div></div>' +
      '<div class="row" style="gap:8px;margin-top:14px"><button class="btn sm" data-act="goalEntry" data-id="' + g.id + '" data-sign="1">' + icon('plus') + t('goal.deposit') + '</button><button class="btn sm ghost" data-act="goalEntry" data-id="' + g.id + '" data-sign="-1">' + t('goal.withdraw') + '</button><button class="btn sm ghost" data-act="goalHistory" data-id="' + g.id + '">' + t('history') + '</button></div></div>';
  }).join('');

      '<div class="grid cols-2">' + cardsHtml + '</div>'
      : '<div class="card empty"><strong>' + t('empty.goalsTitle') + '</strong>' + t('empty.goalsSub') + '<br><button class="btn" data-act="newGoal">' + icon('plus') + t('goal.new') + '</button></div>');
};

/* ---------- Patrimônio ---------- */
VIEWS.networth = () => {
  const nw = netWorth();
  const assets = D().Assets.filter(a => a.class === 'asset' && a.status !== 'sold');
  const liabs = D().Assets.filter(a => a.class === 'liability');
  const sold = D().Assets.filter(a => a.status === 'sold').sort((a, b) => b.soldAt.localeCompare(a.soldAt));
  const yr = todayStr().slice(0, 4);
  const gainYear = sum(sold.filter(a => a.soldAt.slice(0, 4) === yr), a => toBase(a.saleGain, a.currency) || 0);
  const item = a => {

/* ---------- Calendário financeiro ---------- */
function calendarItems(ym) {
  const items = {};
  const push = (d, it) => { if (!d || ymOf(d) !== ym) return; (items[d] = items[d] || []).push(it); };
  D().Transactions.forEach(x => {
    if (x.type === 'transfer') return push(x.date, { kind: 'tx', x, v: 0 });
    const sign = x.type === 'income' || x.type === 'borrow' ? 1 : (x.type === 'expense' || x.type === 'lend' || x.type === 'payment') ? -1 : 0;
    push(x.date, { kind: 'tx', x, v: x.cardId && x.type !== 'payment' ? 0 : sign * (toBase(x.accAmount, (acc(x.accountId) || {}).currency) || 0), card: !!x.cardId && x.type !== 'payment' });
  });
  activeCards().forEach(c => { const i = invoiceInfo(c, ym); if (i.total > 0) push(i.due, { kind: 'invoice', c, i, v: i.remaining > 0 && i.due >= todayStr() ? -(toBase(i.remaining, c.currency) || 0) : 0 }); });
  D().Subscriptions.filter(x => x.active && x.nextDate).forEach(sb => {
    let d = sb.nextDate, g = 0;
    const day = +sb.nextDate.slice(8, 10);
    while (ymOf(d) <= ym && g++ < 60) {
      if (ymOf(d) === ym) push(d, { kind: 'sub', sb, v: sb.cardId ? 0 : -(toBase(sb.amount, sb.currency) || 0) });
      d = sb.cycle === 'yearly' ? dayIn(addMonths(ymOf(d), 12), day) : sb.cycle === 'weekly' ? addDays(d, 7) : dayIn(addMonths(ymOf(d), 1), day);
    }
  });
  D().Loans.filter(l => l.status !== 'closed' && l.dueDate).forEach(l => push(l.dueDate, { kind: 'loan', l, v: 0 }));
  D().Goals.filter(g => g.status === 'active' && g.deadline).forEach(g => push(g.deadline, { kind: 'goal', g, v: 0 }));
  return items;
}
function compact(v) {
  const a = Math.abs(v), sgn = v < 0 ? '−' : '+';
  return sgn + new Intl.NumberFormat(loc(), { maximumFractionDigits: a >= 1000 ? 1 : 0, notation: a >= 10000 ? 'compact' : 'standard' }).format(a);
}
VIEWS.calendar = () => {
  const ym = S.month, td = todayStr();
  if (!S.calDay || ymOf(S.calDay) !== ym) S.calDay = ymOf(td) === ym ? td : ym + '-01';
  const items = calendarItems(ym);
  const first = new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1, 1).getDay();
  // saldo previsto em contas, dia a dia (lançamentos pagos e pendentes + faturas e assinaturas a vencer)
  let bal = totalBalance({ projected: true, until: addDays(ym + '-01', -1) });
  const wd = [...Array(7)].map((_, i) => { const w = new Intl.DateTimeFormat(loc(), { weekday: 'short' }).format(new Date(2024, 0, 7 + i)).replace('.', ''); return w.charAt(0).toUpperCase() + w.slice(1); });
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div class="cal-cell empty"></div>';
  const balByDay = {};
  for (let d = 1; d <= lastDay(ym); d++) {
    const ds = ym + '-' + pad(d), list = items[ds] || [];
    const net = sum(list, it => it.v);
    bal = round2(bal + sum(list.filter(it => it.kind === 'tx' || it.kind === 'invoice' || (it.kind === 'sub' && ds >= td)), it => it.v));
    balByDay[ds] = bal;
    const dots = [...new Set(list.map(it => it.kind === 'tx' ? (it.x.type === 'income' || it.x.type === 'borrow' ? 'in' : 'out') : it.kind))].slice(0, 4).map(k => '<i class="cd cd-' + k + '"></i>').join('');
    cells += '<button class="cal-cell ' + (ds === S.calDay ? 'sel ' : '') + (ds === td ? 'today' : '') + '" data-act="calDay" data-d="' + ds + '" aria-label="' + dateLabel(ds, { day: 'numeric', month: 'long' }) + '"><span class="cal-n">' + d + '</span>' +
      (Math.abs(net) >= 0.01 ? '<span class="cal-v ' + (net > 0 ? 'pos' : 'neg') + '">' + hv(compact(net)) + '</span>' : '') + '<span class="cal-dots">' + dots + '</span></button>';
  }
  const sel = items[S.calDay] || [];
  const kindRow = it => {

/* ---------- Quitação de dívidas ---------- */
function simulatePayoff(debts, extra, mode) {
  const ds = debts.map(d => ({ id: d.id, name: d.name, bal: d.bal, r: d.rate / 100, pay: d.pay, done: null }));
  const budget = sum(ds, d => d.pay) + extra;
  let month = 0, interest = 0;
  while (ds.some(d => d.bal > 0.005) && month < 600) {
    month++;
    ds.forEach(d => { if (d.bal > 0) { const i = d.bal * d.r; d.bal += i; interest += i; } });
    let left = budget;
    ds.forEach(d => { if (d.bal > 0) { const p = Math.min(d.pay, d.bal); d.bal -= p; left -= p; } });
    if (mode !== 'min') {
      const order = ds.filter(d => d.bal > 0.005).sort(mode === 'snowball' ? (a, b) => a.bal - b.bal : (a, b) => b.r - a.r || a.bal - b.bal);
      for (const d of order) { if (left <= 0) break; const p = Math.min(left, d.bal); d.bal -= p; left -= p; }
    }
    ds.forEach(d => { if (d.bal <= 0.005 && d.done == null) { d.bal = 0; d.done = month; } });
  }
  return { months: ds.some(d => d.done == null) ? null : month, interest: round2(interest), order: ds.slice().sort((a, b) => (a.done || 9999) - (b.done || 9999)) };
}
VIEWS.debts = () => {
  const list = D().Assets.filter(a => a.class === 'liability' && a.value > 0);
  const tot = sum(list, a => toBase(a.value, a.currency) || 0);
  const pays = sum(list, a => toBase(a.payment || 0, a.currency) || 0);
  const intM = sum(list, a => toBase(a.value * (a.rate || 0) / 100, a.currency) || 0);
  const ready = list.filter(a => a.payment > 0);
  const missing = list.filter(a => !(a.payment > 0));
  const extra = S.extraPay || 0;
  const debts = ready.map(a => ({ id: a.id, name: a.name, bal: toBase(a.value, a.currency) || 0, rate: a.rate || 0, pay: toBase(a.payment, a.currency) || 0 }));
  const never = debts.filter(d => d.pay <= d.bal * d.rate / 100 + 0.005);
  const startYm = ymOf(todayStr());
  const when = m => m == null ? t('debt.never') : monthLabel(addMonths(startYm, m)) + ' <span class="muted small">(' + t('debt.inMonths', { n: m }) + ')</span>';
  let sim = '';
  if (debts.length) {

/* =====================================================================
 * GRÁFICOS (SVG)
 * ===================================================================== */
function donut(items) {
  const tot = sum(items, x => x.v) || 1;
  const R = 60, C = 2 * Math.PI * R;
  let off = 0;
  const segs = items.map(x => {
    const len = x.v / tot * C;
    const s = '<circle cx="80" cy="80" r="' + R + '" fill="none" stroke="' + esc(x.color || '#8A94A6') + '" stroke-width="22" stroke-dasharray="' + Math.max(0, len - 1.5) + ' ' + C + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 80 80)"/>';
    off += len;
    return s;
  }).join('');
  return '<svg viewBox="0 0 160 160" style="width:100%;max-width:160px" role="img" aria-label="' + t('spendByCat') + '"><circle cx="80" cy="80" r="' + R + '" fill="none" stroke="var(--line-2)" stroke-width="22"/>' + segs + '</svg>';
}
function barsChart(n) {
  const months = [];
  for (let k = n - 1; k >= 0; k--) months.push(addMonths(S.month, -k));
  const data = months.map(m => Object.assign({ m }, monthTotals(m, { includePending: true })));
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
  const W = 600, H = 190, pb = 24, gw = W / n, bw = Math.min(22, gw / 4);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t('last6') + '">';
  [0.25, 0.5, 0.75, 1].forEach(f => { const y = (H - pb) - (H - pb - 10) * f; s += '<line x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--line-2)"/>'; });
  data.forEach((d, i) => {
    const cx = gw * i + gw / 2;
    const hi = (H - pb - 10) * d.inc / max, he = (H - pb - 10) * d.exp / max;
    s += '<rect x="' + (cx - bw - 2) + '" y="' + (H - pb - hi) + '" width="' + bw + '" height="' + hi + '" rx="5" fill="var(--in)"><title>' + t('income') + ': ' + money(d.inc) + '</title></rect>';
    s += '<rect x="' + (cx + 2) + '" y="' + (H - pb - he) + '" width="' + bw + '" height="' + he + '" rx="5" fill="var(--out)"><title>' + t('expenses') + ': ' + money(d.exp) + '</title></rect>';
    s += '<text x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' + monthLabel(d.m, true) + '</text>';
  });
  return s + '</svg>';
}
function lineChart(pts) {
  const W = 600, H = 180, pb = 24, pt = 14;
  const vals = pts.map(p => p.v), min = Math.min(...vals), max = Math.max(...vals), rng = (max - min) || 1;
  const x = i => 20 + (W - 40) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
  const y = v => pt + (H - pb - pt) * (1 - (v - min) / rng);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(p.v)).join(' ');
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t('nw.evolution') + '"><path d="' + path + '" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linejoin="round"/>';
  pts.forEach((p, i) => { s += '<circle cx="' + x(i) + '" cy="' + y(p.v) + '" r="4" fill="var(--brand)"><title>' + money(p.v) + '</title></circle><text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(p.l) + '</text>'; });
  return s + '</svg>';
}

function syncTx() {
  const d = TX; if (!d || !$('#f-tx')) return;
  const v = id => { const el = $('#' + id); return el ? el.value : undefined; };
  if (v('tx-amount') !== undefined) d.amount = v('tx-amount');
  if (v('tx-cur') !== undefined) d.currency = v('tx-cur');
  if (v('tx-rate') !== undefined) d.rate = v('tx-rate');
  if (v('tx-torate') !== undefined) d.toRate = v('tx-torate');
  if (v('tx-date') !== undefined) d.date = v('tx-date');
  if (v('tx-desc') !== undefined) d.description = v('tx-desc');
  if (v('tx-acc') !== undefined) d.accountId = v('tx-acc');
  if (v('tx-to') !== undefined) d.toAccountId = v('tx-to');
  if (v('tx-inst') !== undefined) d.installments = +v('tx-inst');
  if (v('tx-rep') !== undefined) d.repeat = +v('tx-rep');
  if (v('tx-notes') !== undefined) d.notes = v('tx-notes');
  const p = $('#tx-paid'); if (p) d.status = p.checked ? 'paid' : 'pending';
  $$('[data-split]').forEach(el => { const r = d.splits[+el.dataset.i]; if (r) r[el.dataset.split] = el.value; });
}
function splitLeftUi() {
  const el = $('#split-left'); if (!el || !TX) return;
  const total = parseNum($('#tx-amount') ? $('#tx-amount').value : TX.amount);
  const used = sum(TX.splits, r => parseNum(r.amount));
  const left = round2(total - used), cur = TX.currency || holderCur(TX);
  el.className = 'small grow ' + (Math.abs(left) < 0.01 ? 'pos' : left < 0 ? 'neg' : 'muted');
  el.textContent = Math.abs(left) < 0.01 ? t('split.ok') : left > 0 ? t('split.left', { v: money(left, cur) }) : t('split.over', { v: money(-left, cur) });
}
function bindTxForm() {
  const re = () => { syncTx(); const y = $('.sheet-body').scrollTop; renderTxForm({ keepFocus: true }); $('.sheet-body').scrollTop = y; };
  $$('[data-txtype]').forEach(b => b.onclick = () => { syncTx(); TX.type = b.dataset.txtype; TX.categoryId = ''; if (TX.type === 'transfer') TX.cardId = ''; if (TX.type !== 'expense') TX.installments = 1; re(); });
  $$('[data-cat]').forEach(b => b.onclick = () => { syncTx(); TX.categoryId = b.dataset.cat; $$('[data-cat]').forEach(x => x.classList.toggle('on', x === b)); });
  $$('[data-holder]').forEach(b => b.onclick = () => {
    syncTx();
    const [k, id] = b.dataset.holder.split(':');
    const oldCur = holderCur(TX);
    if (k === 'a') { TX.accountId = id; TX.cardId = ''; } else { TX.cardId = id; TX.status = 'paid'; }
    if (TX.currency === oldCur) TX.currency = holderCur(TX);
    TX.rate = ''; re();
  });
  const cur = $('#tx-cur'); if (cur) cur.onchange = () => { syncTx(); TX.rate = ''; TX.rateInfo = ''; re(); if (TX.currency !== holderCur(TX)) autoSuggest('rate', TX.currency, holderCur(TX)); };
  ['tx-acc', 'tx-to'].forEach(id => { const el = $('#' + id); if (el) el.onchange = () => { syncTx(); TX.currency = holderCur(TX); TX.toRate = ''; re(); const dest = acc(TX.toAccountId); if (dest && dest.currency !== holderCur(TX)) autoSuggest('toRate', holderCur(TX), dest.currency); }; });
  const dt = $('#tx-date'); if (dt && TX.cardId) dt.onchange = re;
  ['tx-rate', 'tx-torate'].forEach(id => { const el = $('#' + id); if (el) el.onchange = re; });

  const fi = $('#tx-file'); if (fi) fi.onchange = async () => { const f = fi.files[0]; if (!f) return; syncTx(); TX.receipt = await fileToPayload(f); re(); };
  $$('[data-split]').forEach(el => { el.oninput = el.onchange = () => { syncTx(); splitLeftUi(); }; });

  if ($('#tx-amount')) $('#tx-amount').addEventListener('input', splitLeftUi);

  $('#f-tx').onsubmit = e => { e.preventDefault(); saveTx(); };

async function autoSuggest(target, from, to) {
  try {
    const r = await call('suggestRate', { from, to });
    if (!TX || !r.rate) { if (TX && !r.rate) { TX.rateInfo = t('rate.unavailable'); } return; }
    syncTx();
    if (TX[target]) return;
    TX[target] = String(round6(r.rate)).replace('.', LANG === 'en' ? '.' : ',');
    TX.rateInfo = t('rate.suggested');
    // preenche só o campo, sem redesenhar o formulário (não tira o foco de quem está digitando)
    const inp = $(target === 'rate' ? '#tx-rate' : '#tx-torate');
    if (inp && !inp.value) {
      inp.value = TX[target];
      const info = $('#rate-info');
      if (target === 'rate' && info) info.textContent = (TX.amount ? t('rate.converted', { v: money(parseNum(TX.amount) * r.rate, holderCur(TX)) }) + ' · ' : '') + t('rate.suggested');
    }
  } catch (e) { }
}
const round6 = n => Math.round(n * 1e6) / 1e6;

async function saveTx() {
  syncTx();
  const d = TX;
  const err = m => { $('#tx-err').innerHTML = '<div class="err">' + m + '</div>'; };
  const amount = parseNum(d.amount);
  if (!(amount > 0)) return err(t('err.INVALID_AMOUNT'));
  let splits = null;
  if (d.type !== 'transfer' && d.splitOn) {
    const rows = d.splits.filter(r => r.categoryId || parseNum(r.amount) > 0);
    const empty = rows.filter(r => !(parseNum(r.amount) > 0));
    if (empty.length === 1) empty[0].amount = num(round2(amount - sum(rows, r => parseNum(r.amount))), 2); // a linha vazia recebe o restante
    splits = rows.map(r => ({ categoryId: r.categoryId, amount: round2(parseNum(r.amount)), note: r.note || '' })).filter(r => r.amount > 0);
    if (splits.length < 2) return err(t('err.SPLIT_TWO'));
    if (splits.some(r => !r.categoryId)) return err(t('err.CATEGORY_REQUIRED'));
    const diff = round2(amount - sum(splits, r => r.amount));
    if (Math.abs(diff) > 0.01) return err(t('err.SPLIT_SUM') + ' (' + money(diff, d.currency, { sign: true }) + ')');
    d.categoryId = splits[0].categoryId;
  }
  if (d.type !== 'transfer' && !d.categoryId) return err(t('err.CATEGORY_REQUIRED'));
  if (!d.accountId && !d.cardId) return err(t('err.ACCOUNT_REQUIRED'));
  const hc = holderCur(d);
  if (d.currency !== hc && !(parseNum(d.rate) > 0)) return err(t('err.RATE_REQUIRED'));
  const payload = {
    id: d.id, type: d.type, amount, currency: d.currency, rate: d.currency !== hc ? parseNum(d.rate) : 1,
    date: d.date, description: d.description, categoryId: d.categoryId,
    accountId: d.cardId ? '' : d.accountId, cardId: d.type === 'transfer' ? '' : d.cardId, toAccountId: d.toAccountId, toRate: parseNum(d.toRate),
    status: d.status, installments: d.installments, repeat: d.repeat, notes: d.notes, source: d.source,
    receipt: d.receipt, receiptId: d.receiptId, scope: d.scope || 'one',
    splits: splits || [],
    invoice: d.invoice || '', keepInvoice: !!(d.invoice && d.origDate && d.date === d.origDate && d.cardId === d.origCard)
  };
  if (d.id && d.groupId && !d.scope) {
    return choose(t('scope.title'), [['one', t('scope.one')], ['future', t('scope.future')]], s => { TX.scope = s; saveTx(); });
  }
  const btn = $('[data-act=saveTx]'); if (btn) btn.disabled = true;
  try {
    const r = await saveTxCall(payload);
    if (r.deleted && r.deleted.length) removeLocal('Transactions', r.deleted);
    r.saved.forEach(x => upsertLocal('Transactions', x));
    const cb = d.onSaved;
    closeSheet();
    toast(r.saved.length > 1 ? t('savedN', { n: r.saved.length }) : t('saved'));
    if (cb) cb(r.saved); else rerender();
  } catch (e) { if (btn) btn.disabled = false; if (e.message !== 'CANCELLED') err(errMsg(e)); }
}

/* Salva um lançamento; se o servidor apontar duplicidade, mostra o lançamento parecido e pergunta antes de gravar. */
function saveTxCall(payload) {
  return call('saveTransaction', payload).catch(e => {
    if (!e || e.message !== 'DUPLICATE') throw e;
    const holder = payload.cardId || payload.accountId;
    const cands = D().Transactions.filter(x => x.type === payload.type && x.date === payload.date && (x.cardId || x.accountId) === holder);
    const dup = cands.find(x => Math.abs(Number(x.amount) - Number(payload.amount)) < 0.01) || cands[0];
    const info = dup ? '<p class="small" style="margin:0 0 4px">' + t('dup.existing') + '</p><p style="margin:0"><b>' + esc(dup.description || '—') + '</b><br><span class="small muted">' + dateLabel(dup.date) + ' · ' + esc(holderName(dup)) + '</span></p>' : '';
    return new Promise((resolve, reject) => {
      choose(t('dup.title'), [['yes', t('dup.saveAnyway')]], () => call('saveTransaction', Object.assign({}, payload, { allowDuplicate: true })).then(resolve, reject), info, () => reject(new Error('CANCELLED')));
    });
  });
}

async function suggestBudgets() {
  const m = S.month, out = [];
  activeCats('expense').forEach(c => {
    let s = 0; for (let k = 1; k <= 3; k++) s += (spentByCategory(addMonths(m, -k))[c.id] || 0);
    const avg = s / 3; if (avg > 0) out.push({ c, v: Math.ceil(avg / 10) * 10 });
  });
  if (!out.length) return toast(t('budget.noHistory'), true);
  openSheet(t('budget.suggest'), '<p class="small muted" style="margin-top:0">' + t('budget.suggestHelp') + '</p><div class="list">' + out.map((x, i) => '<label class="li"><input type="checkbox" class="chk" checked data-i="' + i + '">' + catIco(x.c) + '<span class="grow">' + esc(x.c.name) + '</span><span class="amt">' + money(x.v) + '</span></label>').join('') + '</div>',
    '<span class="grow"></span><button class="btn ghost" data-act="closeSheet">' + t('cancel') + '</button><button class="btn" id="apply-sugg">' + t('budget.apply') + '</button>');
  $('#apply-sugg').onclick = async () => {
    const sel = $$('.sheet [data-i]').filter(x => x.checked).map(x => out[+x.dataset.i]);
    $('#apply-sugg').disabled = true;
    for (const x of sel) { try { upsertLocal('Budgets', await call('saveBudget', { categoryId: x.c.id, month: '*', amount: x.v })); } catch (e) { } }
    closeSheet(); toast(t('saved')); rerender();
  };
}

function holdingTime(from, to) {
  if (!from || !to) return '';
  let m = (+to.slice(0, 4) - +from.slice(0, 4)) * 12 + (+to.slice(5, 7) - +from.slice(5, 7));
  if (+to.slice(8, 10) < +from.slice(8, 10)) m--;
  m = Math.max(0, m);
  const y = Math.floor(m / 12), r = m % 12;
  return [y ? t(y === 1 ? 'sale.year1' : 'sale.years', { n: y }) : '', r ? t(r === 1 ? 'sale.month1' : 'sale.months', { n: r }) : ''].filter(Boolean).join(' ' + t('and') + ' ') || t('sale.lessMonth');
}
function saleSummaryHtml(a, saleValue, costs, date) {

/* ---- gravação de áudio (WAV 16 kHz mono) ---- */
const REC = { stream: null, ctx: null, proc: null, chunks: [], start: 0, timer: null, rate: 44100 };
async function capAudio() {
  const hint = $('#cap-hint') ? $('#cap-hint').value : '';
  openSheet(t('cap.audio'),
    '<div class="rec"><button class="rec-btn" id="rec-btn" aria-label="' + t('cap.recStart') + '">' + icon('mic') + '</button><div class="rec-time" id="rec-time">0:00</div><div class="small muted" id="rec-msg">' + t('cap.recHelp') + '</div>' +
    '<label class="small muted">' + t('cap.recFallback') + ' <label class="linkbtn" style="cursor:pointer">' + t('cap.recFile') + '<input type="file" accept="audio/*" capture id="rec-file" hidden></label></label></div><input type="hidden" id="rec-hint" value="' + esc(hint) + '">',
    '<span class="grow"></span><button class="btn ghost" data-act="closeSheet">' + t('cancel') + '</button>', { noFocus: true });
  $('#rec-btn').onclick = () => REC.stream ? finishRecording() : startRecording();
  $('#rec-file').onchange = async () => { const f = $('#rec-file').files[0]; if (!f) return; const p = await fileToPayload(f); runCapture({ kind: 'audio', data: p.data, mime: p.mime || 'audio/mpeg', hint: $('#rec-hint').value }); };
}
async function startRecording() {
  try {
    REC.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  } catch (e) { $('#rec-msg').innerHTML = '<span class="neg">' + t('cap.micDenied') + '</span>'; REC.stream = null; return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  REC.ctx = new AC();
  REC.rate = REC.ctx.sampleRate;
  const src = REC.ctx.createMediaStreamSource(REC.stream);
  REC.proc = REC.ctx.createScriptProcessor(4096, 1, 1);
  REC.chunks = [];
  REC.proc.onaudioprocess = e => REC.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(REC.proc); REC.proc.connect(REC.ctx.destination);
  REC.start = Date.now();
  $('#rec-btn').classList.add('live'); $('#rec-btn').innerHTML = icon('stop'); $('#rec-btn').setAttribute('aria-label', t('cap.recStop'));
  $('#rec-msg').textContent = t('cap.recording');
  REC.timer = setInterval(() => {
    const s = Math.floor((Date.now() - REC.start) / 1000);
    const el = $('#rec-time'); if (el) el.textContent = Math.floor(s / 60) + ':' + pad(s % 60);
    if (s >= 90) finishRecording();
  }, 250);
}
function stopRecording(discard) {
  clearInterval(REC.timer);
  if (REC.proc) { try { REC.proc.disconnect(); } catch (e) { } }
  if (REC.stream) REC.stream.getTracks().forEach(tr => tr.stop());
  if (REC.ctx) { try { REC.ctx.close(); } catch (e) { } }
  const chunks = REC.chunks, rate = REC.rate;
  REC.stream = null; REC.proc = null; REC.ctx = null; REC.chunks = [];
  return discard ? null : { chunks, rate };
}
function finishRecording() {
  const hint = $('#rec-hint') ? $('#rec-hint').value : '';
  const r = stopRecording(false);
  if (!r || !r.chunks.length) return;
  const wav = encodeWav(r.chunks, r.rate, 16000);
  runCapture({ kind: 'audio', data: wav, mime: 'audio/wav', hint });
}
function encodeWav(chunks, inRate, outRate) {
  const len = sum(chunks, c => c.length);
  const all = new Float32Array(len); let o = 0; chunks.forEach(c => { all.set(c, o); o += c.length; });
  const ratio = inRate / outRate, n = Math.floor(len / ratio);
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (p, s) => { for (let i = 0; i < s.length; i++) v.setUint8(p + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, outRate, true); v.setUint32(28, outRate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    let s = 0, a = Math.floor(i * ratio), b = Math.min(len, Math.floor((i + 1) * ratio));
    for (let k = a; k < b; k++) s += all[k];
    s = Math.max(-1, Math.min(1, s / Math.max(1, b - a)));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return bufToB64(buf);
}
function bufToB64(buf) {
  const bytes = new Uint8Array(buf); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

/** lê arquivo; imagens são reduzidas (máx. 1600 px, JPEG) para economizar dados */
function fileToPayload(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    if (/^image\//.test(file.type) && !/gif|svg/.test(file.type)) {
      fr.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
          const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          const url = cv.toDataURL('image/jpeg', 0.82);
          resolve({ mime: 'image/jpeg', data: url.split(',')[1], url });
        };
        img.onerror = () => resolve({ mime: file.type, data: String(fr.result).split(',')[1], url: fr.result });
        img.src = fr.result;
      };
    } else {
      fr.onload = () => resolve({ mime: file.type || 'application/octet-stream', data: String(fr.result).split(',')[1], url: fr.result });
    }
    fr.readAsDataURL(file);
  });
}

function suggToDraft(x, i) {
  const holder = x.cardId ? card(x.cardId) : acc(x.accountId);
  const hc = holder ? holder.currency : base();
  const accs = activeAccounts();
  return newTxDraft(x.type, {
    amount: num(x.amount, 2), currency: x.currency || hc, date: x.date, description: x.description,
    categoryId: x.categoryId, accountId: x.accountId || (x.cardId ? '' : (accs[0] || {}).id || ''), cardId: x.cardId,
    splitOn: !!(x.splits && x.splits.length > 1), splits: (x.splits || []).map(y => ({ categoryId: y.categoryId, amount: num(y.amount, 2), note: y.note })),
    installments: x.installments || 1, source: SUGG.kind === 'pdf' ? 'photo' : (SUGG.kind === 'image' ? 'photo' : SUGG.kind),
    receipt: i === 0 && SUGG.file ? { mime: SUGG.file.mime, data: SUGG.file.data } : null,
    more: x.installments > 1 || (i === 0 && !!SUGG.file),
    aiNote: t('cap.reviewNote'),
    onSaved: () => { SUGG.list[i].saved = true; rerender(); if (SUGG.list.every(y => y.saved)) closeSheet(); else renderSuggestions(SUGG.last); }
  });
}
async function suggSave(i) {
  const x = SUGG.list[i];
  const d = suggToDraft(x, i);
  const hc = holderCur(d);
  if (d.currency !== hc) { openTxForm(d); return; } // precisa de cotação: abre o formulário
  TX = d;
  const payload = { type: d.type, amount: x.amount, currency: d.currency, rate: 1, date: d.date, description: d.description, categoryId: d.categoryId, accountId: d.cardId ? '' : d.accountId, cardId: d.cardId, status: 'paid', installments: d.splitOn ? 1 : d.installments, repeat: 1, source: d.source, receipt: d.receipt, splits: d.splitOn ? x.splits : [] };
  try {
    const r = await saveTxCall(payload);
    r.saved.forEach(y => upsertLocal('Transactions', y));
    x.saved = true; TX = null;
    return true;
  } catch (e) { if (e.message !== 'CANCELLED') toast(errMsg(e), true); return false; }
}

  editGoal: el => goalForm(byId(D().Goals, el.dataset.id)),
  deleteGoal: el => confirmBox(t('confirmDelete'), async () => { try { await call('deleteGoal', { id: el.dataset.id }); removeLocal('Goals', el.dataset.id); D().GoalEntries = D().GoalEntries.filter(e => e.goalId !== el.dataset.id); closeSheet(); toast(t('deleted')); rerender(); } catch (e) { toast(errMsg(e), true); } }, true),
  goalEntry: el => goalEntryForm(el.dataset.id, +el.dataset.sign),
  goalHistory: el => goalHistory(el.dataset.id),
  delGoalEntry: async el => { try { await call('deleteGoalEntry', { id: el.dataset.id }); removeLocal('GoalEntries', el.dataset.id); rerender(); goalHistory(el.dataset.g); } catch (e) { toast(errMsg(e), true); } },
  newAsset: el => assetForm(null, el.dataset.class),
  editAsset: el => { const a = byId(D().Assets, el.dataset.id); if (a.status === 'sold') saleReport(a); else assetForm(a); },
  sellAsset: el => { const a = byId(D().Assets, el.dataset.id); if (!a.cost && !a.improvements) toast(t('sale.noBasisToast')); sellForm(a); },
  saleReport: el => saleReport(byId(D().Assets, el.dataset.id)),
  unsellAsset: el => confirmBox(t('sale.undoConfirm'), async () => {
    try { const r = await call('unsellAsset', { id: el.dataset.id }); upsertLocal('Assets', r.asset); removeLocal('Transactions', r.deleted); closeSheet(); toast(t('sale.undone')); rerender(); snapshotIfNeeded(); } catch (e) { toast(errMsg(e), true); }
  }, true),
  deleteAsset: el => confirmBox(t('confirmDelete'), async () => { try { await call('deleteAsset', { id: el.dataset.id }); removeLocal('Assets', el.dataset.id); closeSheet(); toast(t('deleted')); rerender(); } catch (e) { toast(errMsg(e), true); } }, true),
  editRate: el => rateForm(el.dataset.c),
  refreshRates: async el => { el.disabled = true; try { (await call('refreshRates', { force: true })).forEach(r => upsertLocal('Rates', r)); toast(t('set.ratesUpdated')); rerender(); } catch (e) { toast(errMsg(e), true); el.disabled = false; } },
  exportCsv: async () => {
    try {
      const csv = await call('exportCsv');
      const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent('﻿' + csv); a.download = 'myfinance_' + todayStr() + '.csv'; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { toast(errMsg(e), true); }
  },
  logout: async () => { try { await call('logout'); } catch (e) { } logoutLocal(); },
  dismissOnboard: async () => { S.settings.onboarded = 'true'; rerender(); try { await call('setSetting', { key: 'onboarded', value: 'true' }); } catch (e) { } },
  aiInsights: async el => {
    el.disabled = true; $('#ai-insights').innerHTML = '<div class="spinner"></div>';
    const m = S.month, spent = spentByCategory(m);
    const prevAvg = {}; for (let k = 1; k <= 3; k++) { const sp = spentByCategory(addMonths(m, -k)); Object.keys(sp).forEach(c => prevAvg[c] = (prevAvg[c] || 0) + sp[c] / 3); }
    const summary = {
      month: m, totals: monthTotals(m, { includePending: true }), prev3: [1, 2, 3].map(k => monthTotals(addMonths(m, -k))),
      categories: Object.keys(spent).map(c => ({ name: (cat(c) || {}).name, spent: round2(spent[c]), avg3: round2(prevAvg[c] || 0), budget: budgetFor(c, m) })).sort((a, b) => b.spent - a.spent).slice(0, 12),
      balance: totalBalance(), netWorth: netWorth().total, cardDebt: cardDebtBase(),
      goals: D().Goals.filter(g => g.status === 'active').map(g => ({ name: g.name, saved: goalSaved(g), target: g.target, deadline: g.deadline }))
    };
    try { const r = await call('aiInsights', { summary }); $('#ai-insights').innerHTML = '<div style="color:var(--ink);white-space:pre-wrap">' + esc(r.text.replace(/\*\*/g, '')) + '</div>'; }
    catch (e) { $('#ai-insights').innerHTML = '<div class="err">' + errMsg(e) + '</div>'; }
    el.disabled = false;
  },
  adminTest: async el => {
    const old = el.textContent; el.disabled = true; el.textContent = t('admin.testing');
    try { const r = await call('adminTestAi'); toast(t('admin.testOk', { m: r.model })); S.aiReady = true; }
    catch (e) { toast(errMsg(e), true); }
    finally { el.disabled = false; el.textContent = old; }
  },
  adminUser: async el => { try { await call('adminSetUserStatus', { id: el.dataset.id, status: el.dataset.s }); loadAdmin(); } catch (e) { toast(errMsg(e), true); } },
  conflict: el => {
    const cf = SUGG.conflict;
    const id = el.dataset.v === 'suggested' ? cf.suggestedCategoryId : cf.requestedCategoryId;
    SUGG.list.forEach(x => { if (!x.saved) x.categoryId = id; });
    SUGG.conflictDone = true; renderSuggestions(SUGG.last);
  },
  suggEdit: el => openTxForm(suggToDraft(SUGG.list[+el.dataset.i], +el.dataset.i)),
  suggDrop: el => { SUGG.list.splice(+el.dataset.i, 1); renderSuggestions(SUGG.last); },
  suggSave: async el => { el.disabled = true; if (await suggSave(+el.dataset.i)) { toast(t('saved')); rerender(); if (SUGG.list.every(y => y.saved)) closeSheet(); else renderSuggestions(SUGG.last); } else el.disabled = false; },
  suggSaveAll: async el => {
    el.disabled = true;
    for (let i = 0; i < SUGG.list.length; i++) {
      const x = SUGG.list[i]; if (x.saved) continue;
      const d = suggToDraft(x, i);
      if (d.currency !== holderCur(d)) { renderSuggestions(SUGG.last); return openTxForm(d); }
      if (!(await suggSave(i))) break;
    }
    toast(t('saved')); rerender(); closeSheet();
  }
};
// O Apps Script roda o app num iframe com <base target="_top">: links "#tela" abririam a página interna
// em tela cheia. Aqui a troca de tela é feita dentro do próprio app.
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  if (a.dataset.act) return;
  const h = a.getAttribute('href').slice(1);
  if (!h) return;
  if (location.hash.replace('#', '') === h) { closeSheet(); route(h); } else location.hash = h;
}, true);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  fn(el, e);
});

/* ---------- tema & início ---------- */
function applyTheme() {
  const th = store.get('mf_theme') || 'auto';
  if (th === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', th);
}
async function boot() {
  applyTheme();
  try { S.info = await call('info'); } catch (e) { S.info = {}; }
  if (S.token) loadApp().then(() => {
    if (!S.d) return;
    if (window.START_ACTION === 'audio' && S.aiReady) capAudio(); else if (window.START_ACTION) openCapture();
  }); else renderAuth('login');
}
boot();
</script>
